# secretarIA-frontend — nginx for the Next.js static export (`out/`).
#
# The Dockerfile copies this file to /etc/nginx/conf.d/default.conf, so it is
# included from inside nginx's `http` block. That is what makes the `map`
# directives below legal here, and it means this is the only config the
# container ever serves with: there is no second file adding headers, and no
# Node process in production.

# ── Cache-Control, chosen by path instead of by `location` ─────────────────
# Build assets carry a content hash in their filename, so a given URL can never
# go stale. Everything else is HTML that must be revalidated.
map $uri $secretaria_cache_control {
    default           "no-cache, no-store, must-revalidate";
    ~^/_next/static/  "public, max-age=31536000, immutable";
}

# ── Referrer-Policy, likewise by path ──────────────────────────────────────
# The default is the modern recommendation: a cross-origin request leaks only
# the origin, never the path or the query string.
#
# The password-reset and team-invite screens get `no-referrer` instead, because
# they are reached as /esqueci_senha/token/?token=… , /esqueci_senha/
# atualizar_senha/?token=… and /convite/?token=… . Under
# `strict-origin-when-cross-origin` a SAME-origin subresource request still
# carries the full URL — token included — as its Referer, and that page's own
# JS and CSS are same-origin requests fired before the page can clean its URL.
# The token would land in this server's access log on every reset. Nothing in
# this app or in brain-api reads a referrer, so dropping it costs nothing.
map $uri $secretaria_referrer_policy {
    default                      "strict-origin-when-cross-origin";
    ~^/(esqueci_senha|convite)/  "no-referrer";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the exact nginx build in every response.
    server_tokens off;

    # ── Response headers ───────────────────────────────────────────────────
    # THESE LIVE AT `server` LEVEL AND NOTHING BELOW MAY ADD AN `add_header`
    # OF ITS OWN. nginx's add_header replaces rather than merges across levels:
    # a `location` that sets any header at all inherits NONE of these. This
    # file used to set Cache-Control inside `location /`, which is precisely
    # why Cache-Control and Referrer-Policy are `map`s above — with their
    # per-path values resolved by variable, the header list stays in one place
    # and every location, present or future, plus the 404 page, gets all of it.
    #
    # `always` extends each header to error responses too (the 404 below).
    add_header Cache-Control            $secretaria_cache_control  always;
    add_header Referrer-Policy          $secretaria_referrer_policy always;
    add_header X-Content-Type-Options   "nosniff"                  always;
    add_header X-Frame-Options          "DENY"                     always;
    add_header Permissions-Policy       "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # This container listens on plain :80 behind EasyPanel's TLS-terminating
    # proxy, so the browser sees HTTPS and honours this. Deliberately no
    # `preload`: that is a one-way door, and this app lives on a subdomain of a
    # shared *.easypanel.host parent.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Content-Security-Policy ────────────────────────────────────────────
    # `script-src` allows 'unsafe-inline' ON PURPOSE. Do not "tighten" it to a
    # hash list without reading this first:
    #
    #   Every page of this export ships ~7 inline <script> blocks. One is the
    #   theme bootstrap in app/layout.tsx; the other six are the App Router's
    #   RSC hydration payloads (`self.__next_f.push([...])`). Those six differ
    #   per route AND embed a build id that changes on every `next build`, so a
    #   static hash list goes stale the moment anyone rebuilds — and a stale
    #   hash is a white screen for a paying clinic, with no warning at build
    #   time. Hashing them would mean regenerating this file inside the Docker
    #   build, and even then /app/onboarding injects Meta's SDK at runtime
    #   (app/(site)/app/onboarding/lib/meta-embedded-signup.ts), which loads
    #   further code we cannot enumerate.
    #
    #   The exposure this accepts is narrow here: the repo has exactly one
    #   dangerouslySetInnerHTML (that theme script) and no innerHTML, eval or
    #   new Function, so no user-controlled string is ever parsed as HTML. The
    #   remaining directives — object-src, base-uri, form-action,
    #   frame-ancestors, connect-src — still do their jobs.
    #
    # `connect-src` is COUPLED TO THE Dockerfile: those two origins are the
    # NEXT_PUBLIC_MANAGE_API_BASE_URL and NEXT_PUBLIC_SECRETARIA_HUB_BASE_URL
    # build args. Change one there and it must change here, or every API call
    # in the app is blocked by the browser with no server-side trace.
    #
    # To roll back fast without redeploying anything else, rename this header
    # to Content-Security-Policy-Report-Only: the browser then reports
    # violations in the console and blocks nothing.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.facebook.com; connect-src 'self' https://secretaria-brain-api.cpux9k.easypanel.host https://secretaria-secretaria-api.cpux9k.easypanel.host https://connect.facebook.net https://www.facebook.com; frame-src https://www.facebook.com https://web.facebook.com https://connect.facebook.net; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Next.js static export (trailingSlash: true) generates folder-style URLs:
    # /login/index.html, /inicio/index.html, /configuracao/index.html …
    location / {
        # Every route is pre-rendered to a real file at build time — `output:
        # "export"`, `trailingSlash: true`, and no dynamic [param] routes — so a
        # path with nothing on disk is genuinely unknown and must say so. The
        # last entry used to be /index.html, an SPA-style catch-all that
        # answered 200 with the login screen for ANY url, /robots.txt included.
        try_files $uri $uri.html $uri/ =404;
    }

    # `next build` writes both out/404.html and out/404/index.html; either
    # works. Served through `location /` above, which finds it via `try_files
    # $uri`, and answered with a real 404 status.
    error_page 404 /404.html;

    gzip on;
    # No text/html here: nginx always gzips it when gzip is on, and naming it
    # again makes the container log a `duplicate MIME type` warning at boot.
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
